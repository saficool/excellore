{{- $root := . -}}
{{- range $service := list
  (dict "name" "shell" "port" 3000)
  (dict "name" "profile-bff" "port" 3000)
  (dict "name" "access-bff" "port" 3000)
  (dict "name" "platform-bff" "port" 3000)
  (dict "name" "profile-api" "port" 8080)
  (dict "name" "access-api" "port" 8080)
  (dict "name" "notifications-api" "port" 8080)
}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "excellore.fullname" $root }}-{{ $service.name }}
  labels:
    {{- include "excellore.labels" $root | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/part-of: {{ include "excellore.name" $root }}
    app.kubernetes.io/name: {{ $service.name }}
  ports:
    - name: http
      port: {{ $service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
