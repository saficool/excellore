{{- $root := . -}}
{{- range $name := list "shell" "profile-bff" "access-bff" "platform-bff" "profile-api" "access-api" "profile-worker" "access-worker" "keycloak" "identity-proxy" "rls-auditor" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "excellore.fullname" $root }}-{{ $name }}
  labels:
    {{- include "excellore.labels" $root | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
