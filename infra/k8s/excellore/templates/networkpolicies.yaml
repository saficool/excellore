apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "excellore.fullname" . }}-default-deny
  labels:
    {{- include "excellore.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "excellore.fullname" . }}-dns
  labels:
    {{- include "excellore.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "excellore.fullname" . }}-public-ingress
  labels:
    {{- include "excellore.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [shell, profile-bff, access-bff, platform-bff, identity-proxy]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingress.namespace }}
      ports:
        - { protocol: TCP, port: 3000 }
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "excellore.fullname" . }}-profile-api-ingress
  labels:
    {{- include "excellore.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: profile-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: profile-bff
      ports: [{ protocol: TCP, port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "excellore.fullname" . }}-access-api-ingress
  labels:
    {{- include "excellore.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: access-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [shell, profile-bff, access-bff, platform-bff, profile-api, notifications-worker]
      ports: [{ protocol: TCP, port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "excellore.fullname" . }}-keycloak-ingress
  labels:
    {{- include "excellore.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [shell, profile-bff, access-bff, platform-bff, profile-api, access-api, profile-worker, access-worker, notifications-worker, identity-proxy]
      ports: [{ protocol: TCP, port: 8080 }]
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      ports:
        - { protocol: TCP, port: 7800 }
        - { protocol: TCP, port: 57800 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "excellore.fullname" . }}-bff-egress
  labels:
    {{- include "excellore.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      excellore.io/class: bff
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [profile-api, access-api, keycloak]
      ports:
        - { protocol: TCP, port: 8080 }
    {{- range .Values.network.valkeyCidrs }}
    - to: [{ ipBlock: { cidr: {{ . | quote }} } }]
      ports: [{ protocol: TCP, port: 6379 }]
    {{- end }}
    {{- range .Values.network.identityIngressCidrs }}
    - to: [{ ipBlock: { cidr: {{ . | quote }} } }]
      ports: [{ protocol: TCP, port: 443 }]
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "excellore.fullname" . }}-service-egress
  labels:
    {{- include "excellore.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: excellore.io/class
        operator: In
        values: [api, worker]
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: access-api
      ports: [{ protocol: TCP, port: 8080 }]
    {{- range .Values.network.postgresCidrs }}
    - to: [{ ipBlock: { cidr: {{ . | quote }} } }]
      ports: [{ protocol: TCP, port: 5432 }]
    {{- end }}
    {{- range .Values.network.valkeyCidrs }}
    - to: [{ ipBlock: { cidr: {{ . | quote }} } }]
      ports: [{ protocol: TCP, port: 6379 }]
    {{- end }}
    {{- range .Values.network.rabbitMqCidrs }}
    - to: [{ ipBlock: { cidr: {{ . | quote }} } }]
      ports: [{ protocol: TCP, port: 5671 }]
    {{- end }}
    {{- range .Values.network.objectStoreCidrs }}
    - to: [{ ipBlock: { cidr: {{ . | quote }} } }]
      ports: [{ protocol: TCP, port: 443 }]
    {{- end }}
    {{- range .Values.network.smtpCidrs }}
    - to: [{ ipBlock: { cidr: {{ . | quote }} } }]
      ports: [{ protocol: TCP, port: 587 }]
    {{- end }}
    {{- range .Values.network.identityIngressCidrs }}
    - to: [{ ipBlock: { cidr: {{ . | quote }} } }]
      ports: [{ protocol: TCP, port: 443 }]
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "excellore.fullname" . }}-keycloak-egress
  labels:
    {{- include "excellore.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      ports:
        - { protocol: TCP, port: 7800 }
        - { protocol: TCP, port: 57800 }
    {{- range .Values.network.postgresCidrs }}
    - to: [{ ipBlock: { cidr: {{ . | quote }} } }]
      ports: [{ protocol: TCP, port: 5432 }]
    {{- end }}
    {{- range .Values.network.smtpCidrs }}
    - to: [{ ipBlock: { cidr: {{ . | quote }} } }]
      ports: [{ protocol: TCP, port: 587 }]
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "excellore.fullname" . }}-identity-proxy-egress
  labels:
    {{- include "excellore.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: identity-proxy
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      ports: [{ protocol: TCP, port: 8080 }]
