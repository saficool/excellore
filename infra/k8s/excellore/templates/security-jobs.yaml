apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "excellore.fullname" . }}-rls-auditor
  labels:
    {{- include "excellore.labels" . | nindent 4 }}
data:
  verify.sql: |
    DO $check$
    DECLARE
      missing_rls text;
      unsafe_roles text;
    BEGIN
      SELECT string_agg(c.relname, ', ' ORDER BY c.relname)
        INTO missing_rls
        FROM pg_class c
        JOIN pg_namespace n ON n.oid = c.relnamespace
       WHERE n.nspname = 'public'
         AND c.relkind IN ('r', 'p')
         AND c.relname NOT IN ('outbox', 'user_tenant_index')
         AND EXISTS (
           SELECT 1 FROM pg_attribute a
            WHERE a.attrelid = c.oid AND a.attname = 'tenant_id' AND NOT a.attisdropped)
         AND NOT (c.relrowsecurity AND c.relforcerowsecurity);

      SELECT string_agg(r.rolname, ', ' ORDER BY r.rolname)
        INTO unsafe_roles
        FROM pg_roles r
       WHERE r.rolcanlogin
         AND r.rolname ~ '_(app|worker|publisher)$'
         AND (r.rolsuper OR r.rolbypassrls OR EXISTS (
           SELECT 1 FROM pg_class c
           JOIN pg_namespace n ON n.oid = c.relnamespace
           WHERE n.nspname = 'public' AND c.relowner = r.oid));

      IF missing_rls IS NOT NULL THEN
        RAISE EXCEPTION 'tenant tables missing forced RLS: %', missing_rls;
      END IF;
      IF unsafe_roles IS NOT NULL THEN
        RAISE EXCEPTION 'unsafe runtime database roles: %', unsafe_roles;
      END IF;
    END
    $check$;
  verify.sh: |
    #!/bin/sh
    set -eu
    psql "$ACCESS_DATABASE_URL" --no-psqlrc --set ON_ERROR_STOP=1 --file /checks/verify.sql >/dev/null
    psql "$PROFILE_DATABASE_URL" --no-psqlrc --set ON_ERROR_STOP=1 --file /checks/verify.sql >/dev/null
    echo "Forced RLS and runtime role verification passed."
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "excellore.fullname" . }}-rls-auditor
  labels:
    {{- include "excellore.labels" . | nindent 4 }}
spec:
  schedule: "17 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: {{ include "excellore.name" . }}
            app.kubernetes.io/name: rls-auditor
            excellore.io/class: security-job
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "excellore.fullname" . }}-rls-auditor
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: verify
              image: {{ include "excellore.image" (dict "root" . "key" "rlsAuditor") }}
              command: ["/checks/verify.sh"]
              securityContext:
                {{- include "excellore.containerSecurityContext" . | nindent 16 }}
              envFrom:
                - secretRef: { name: {{ include "excellore.fullname" . }}-rls-auditor }
              resources:
                requests: { cpu: 25m, memory: 32Mi }
                limits: { cpu: 200m, memory: 128Mi }
              volumeMounts:
                - { name: checks, mountPath: /checks, readOnly: true }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: checks
              configMap:
                name: {{ include "excellore.fullname" . }}-rls-auditor
                defaultMode: 0555
            - { name: tmp, emptyDir: {} }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "excellore.fullname" . }}-rls-auditor-egress
  labels:
    {{- include "excellore.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rls-auditor
  policyTypes: [Egress]
  egress:
    {{- range .Values.network.postgresCidrs }}
    - to: [{ ipBlock: { cidr: {{ . | quote }} } }]
      ports: [{ protocol: TCP, port: 5432 }]
    {{- end }}
