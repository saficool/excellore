{{- if .Values.externalSecrets.enabled }}
{{- $root := . -}}
{{- range $name := list "shell" "profile-bff" "access-bff" "profile-api" "access-api" "profile-worker" "access-worker" "keycloak" "rls-auditor" }}
---
apiVersion: {{ $root.Values.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "excellore.fullname" $root }}-{{ $name }}
  labels:
    {{- include "excellore.labels" $root | nindent 4 }}
spec:
  refreshInterval: {{ $root.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ $root.Values.externalSecrets.storeRef.kind }}
    name: {{ $root.Values.externalSecrets.storeRef.name }}
  target:
    name: {{ include "excellore.fullname" $root }}-{{ $name }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ printf "%s/%s" $root.Values.externalSecrets.remotePrefix $name | quote }}
{{- end }}
{{- end }}
