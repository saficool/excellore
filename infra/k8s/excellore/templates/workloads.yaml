{{- $root := . -}}
{{- $components := list
  (dict "name" "shell" "image" "shell" "replicas" .Values.replicas.bff "class" "bff" "port" 3000 "assembly" "")
  (dict "name" "profile-bff" "image" "profileBff" "replicas" .Values.replicas.bff "class" "bff" "port" 3000 "assembly" "")
  (dict "name" "access-bff" "image" "accessBff" "replicas" .Values.replicas.bff "class" "bff" "port" 3000 "assembly" "")
  (dict "name" "profile-api" "image" "profileApi" "replicas" .Values.replicas.api "class" "api" "port" 8080 "assembly" "Excellore.Profile.Api.dll")
  (dict "name" "access-api" "image" "accessApi" "replicas" .Values.replicas.api "class" "api" "port" 8080 "assembly" "Excellore.Access.Api.dll")
  (dict "name" "profile-worker" "image" "profileWorker" "replicas" .Values.replicas.worker "class" "worker" "port" 0 "assembly" "Excellore.Profile.Worker.dll")
  (dict "name" "access-worker" "image" "accessWorker" "replicas" .Values.replicas.worker "class" "worker" "port" 0 "assembly" "Excellore.Access.Worker.dll")
-}}
{{- range $component := $components }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "excellore.fullname" $root }}-{{ $component.name }}
  labels:
    {{- include "excellore.labels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ $component.name }}
    excellore.io/class: {{ $component.class }}
spec:
  replicas: {{ $component.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: {{ include "excellore.name" $root }}
      app.kubernetes.io/name: {{ $component.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: {{ include "excellore.name" $root }}
        app.kubernetes.io/name: {{ $component.name }}
        excellore.io/class: {{ $component.class }}
    spec:
      serviceAccountName: {{ include "excellore.fullname" $root }}-{{ $component.name }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "excellore.podSecurityContext" $root | nindent 8 }}
      terminationGracePeriodSeconds: 30
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/part-of: {{ include "excellore.name" $root }}
                    app.kubernetes.io/name: {{ $component.name }}
      containers:
        - name: {{ $component.name }}
          image: {{ include "excellore.image" (dict "root" $root "key" $component.image) }}
          imagePullPolicy: IfNotPresent
          {{- if $component.assembly }}
          args: [{{ $component.assembly | quote }}]
          {{- end }}
          securityContext:
            {{- include "excellore.containerSecurityContext" $root | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "excellore.fullname" $root }}-{{ $component.name }}
                optional: {{ eq $component.class "worker" }}
            - secretRef:
                name: {{ include "excellore.fullname" $root }}-{{ $component.name }}
          {{- if gt (int $component.port) 0 }}
          ports:
            - name: http
              containerPort: {{ $component.port }}
              protocol: TCP
          startupProbe:
            httpGet: { path: /health/live, port: http }
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          {{- end }}
          resources:
            {{- index $root.Values.resources $component.class | toYaml | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if eq $component.class "bff" }}
            - name: next-cache
              mountPath: {{ printf "/app/apps/%s/.next/cache" (trimSuffix "-bff" $component.name) }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if eq $component.class "bff" }}
        - name: next-cache
          emptyDir: {}
        {{- end }}
{{- end }}
