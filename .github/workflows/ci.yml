name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm -w build
      - run: pnpm -w lint
      - run: pnpm -w test
      - run: pnpm -w contracts:check
      - run: pnpm -w permissions:check
        env:
          PERMISSIONS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: pnpm -w permissions:test
      - run: pnpm -w security:scenarios
      - run: pnpm -w observability:check
      - run: pnpm -w format:check
      - name: Validate code-owned local platform staff assignments
        run: node infra/keycloak/build-realm.mjs && git diff --exit-code -- infra/keycloak/realm-dev.json

  handbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: cmp excellore-platform-handbook.md docs/handbook.md

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Excellore.sln --configuration Release
      - name: Audit NuGet dependencies
        shell: bash
        run: |
          audit="$(dotnet package list --project Excellore.sln --vulnerable --include-transitive)"
          printf '%s\n' "$audit"
          if printf '%s\n' "$audit" | grep -Eq ' (High|Critical) '; then
            echo 'High or critical NuGet vulnerability found.' >&2
            exit 1
          fi
      - run: dotnet test Excellore.sln --configuration Release --no-build
      - run: dotnet new install ./templates/excellore-service
      - run: dotnet new excellore-service --name Excellore.Probe --appSlug probe --output .local/template-probe
      - run: dotnet build .local/template-probe/Excellore.Probe.Api/Excellore.Probe.Api.csproj --configuration Release
      - run: dotnet build .local/template-probe/Excellore.Probe.Worker/Excellore.Probe.Worker.csproj --configuration Release
      - run: dotnet test .local/template-probe/Excellore.Probe.Tests/Excellore.Probe.Tests.csproj --configuration Release

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan tracked files for secrets
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo ghcr.io/gitleaks/gitleaks:v8.28.0 git . --redact --no-banner

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @excellore/auth build
      - name: Start production-header probe
        run: |
          node scripts/security-probe-server.mjs > "$RUNNER_TEMP/security-probe.log" 2>&1 &
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/security-probe.log"
          exit 1
      - name: OWASP ZAP baseline
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://127.0.0.1:4173/
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0
          cmd_options: -I
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-security-report
      - name: Reject high-severity ZAP findings
        run: node scripts/check-zap-report.mjs report_json.json
      - name: Trivy repository scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          skip-dirs: node_modules,.git,.local,.next,bin,obj,dist

  load-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate k6 load scenarios
        run: docker run --rm -v "$PWD/tests/load:/tests:ro" grafana/k6:1.8.2 inspect /tests/wp13.js

  security-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start isolated identity stack
        run: bash scripts/dev-up.sh
      - name: Prepare Shell and Profile BFFs
        run: |
          node scripts/setup-next-local.mjs shell
          node scripts/setup-next-local.mjs profile
      - name: Start BFFs
        run: |
          pnpm --filter @excellore/shell dev > "$RUNNER_TEMP/shell.log" 2>&1 &
          pnpm --filter @excellore/profile dev > "$RUNNER_TEMP/profile.log" 2>&1 &
          for attempt in {1..60}; do
            shell_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/ || true)"
            profile_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3001/ || true)"
            if [ "$shell_status" != 000 ] && [ "$profile_status" != 000 ]; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/shell.log" "$RUNNER_TEMP/profile.log"
          exit 1
      - name: Run SSO, tenant launcher, CSP, and global logout scenarios
        run: node scripts/check-shell-login.mjs
      - name: Print service logs after failure
        if: failure()
        run: cat "$RUNNER_TEMP/shell.log" "$RUNNER_TEMP/profile.log" || true
      - name: Stop isolated stack
        if: always()
        run: docker compose --env-file .env -f infra/compose/docker-compose.yml down --volumes
